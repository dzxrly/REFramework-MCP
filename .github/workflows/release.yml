name: REF Nightly Release

on:
  schedule:
    - cron: "17 4,16 * * *"
  workflow_dispatch:
    inputs:
      nightly_tag:
        description: Optional official REFramework-nightly tag; defaults to latest
        required: false
        type: string
      force_release:
        description: Release even when the target is not newer than the verified baseline
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ref-nightly-release
  cancel-in-progress: false

jobs:
  release:
    name: Check, build, and release REF Nightly
    runs-on: windows-2025
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7

      - name: Resolve official REF Nightly
        id: target
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.nightly_tag }}
          FORCE_RELEASE: ${{ inputs.force_release }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          if ([string]::IsNullOrWhiteSpace($env:REQUESTED_TAG)) {
            $uri = "https://api.github.com/repos/praydog/REFramework-nightly/releases/latest"
          } else {
            $encodedTag = [Uri]::EscapeDataString($env:REQUESTED_TAG)
            $uri = "https://api.github.com/repos/praydog/REFramework-nightly/releases/tags/$encodedTag"
          }
          $nightly = Invoke-RestMethod -Uri $uri -Headers $headers
          $match = [regex]::Match(
            [string] $nightly.tag_name,
            "^nightly-(?<number>[0-9]+)-(?<sha>[0-9a-f]{40})$"
          )
          if (-not $match.Success) {
            throw "Unexpected official REF Nightly tag: $($nightly.tag_name)"
          }

          $baseline = Get-Content -LiteralPath "reframework\nightly-baseline.json" -Raw |
            ConvertFrom-Json
          $number = $match.Groups["number"].Value
          $sourceSha = $match.Groups["sha"].Value
          $sourceShort = $sourceSha.Substring(0, 8)
          $releaseHash = [Guid]::NewGuid().ToString("N").Substring(0, 8)
          $releasePrefix = "v$($baseline.mcp_version)-ref-nightly-$number-$sourceShort"
          $releaseTag = "$releasePrefix-$releaseHash"
          $assetStem = "reframework-mcp-$($baseline.mcp_version)-ref-nightly-$number-$sourceShort-$releaseHash-windows-x64"

          $releaseJson = & gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName
          if ($LASTEXITCODE -ne 0) {
            throw "Reading existing releases failed."
          }
          $existingReleases = @($releaseJson | ConvertFrom-Json)
          $alreadyReleased = @(
            $existingReleases |
              Where-Object { ([string] $_.tagName).StartsWith("$releasePrefix-") }
          ).Count -gt 0
          $isUpdate = [long] $number -gt [long] $baseline.release_number
          $forceRelease = $env:FORCE_RELEASE -eq "true"
          $shouldRelease = $forceRelease -or ($isUpdate -and -not $alreadyReleased)

          "should_release=$($shouldRelease.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "nightly_tag=$($nightly.tag_name)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_number=$number" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "mcp_version=$($baseline.mcp_version)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "source_sha=$sourceSha" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_hash=$releaseHash" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_tag=$releaseTag" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "asset_stem=$assetStem" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($shouldRelease) {
            $decision = "build and release"
          } elseif ($alreadyReleased) {
            $decision = "skip; this Nightly already has a release"
          } else {
            $decision = "skip; no newer Nightly was found"
          }
          @"
          ## REF Nightly check

          - Target: $($nightly.tag_name)
          - Source: $sourceSha
          - Decision: $decision
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Check out official REF Nightly source
        if: ${{ steps.target.outputs.should_release == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: praydog/REFramework
          ref: ${{ steps.target.outputs.source_sha }}
          path: reframework-source
          submodules: recursive

      - uses: actions/setup-python@v7
        if: ${{ steps.target.outputs.should_release == 'true' }}
        with:
          python-version: "3.11"
          check-latest: true
          cache: pip

      - name: Build release package
        if: ${{ steps.target.outputs.should_release == 'true' }}
        shell: pwsh
        env:
          NIGHTLY_TAG: ${{ steps.target.outputs.nightly_tag }}
          NIGHTLY_SHA: ${{ steps.target.outputs.source_sha }}
          NIGHTLY_NUMBER: ${{ steps.target.outputs.release_number }}
          RELEASE_HASH: ${{ steps.target.outputs.release_hash }}
        run: |
          $ErrorActionPreference = "Stop"
          $parameters = @{
            REFrameworkRoot = "$env:GITHUB_WORKSPACE\reframework-source"
            NightlyTag = $env:NIGHTLY_TAG
            SourceCommit = $env:NIGHTLY_SHA
            ReleaseNumber = $env:NIGHTLY_NUMBER
            ReleaseId = $env:RELEASE_HASH
            OutputDirectory = "$env:GITHUB_WORKSPACE\.tmp\release-output"
          }
          .\scripts\build_ref_nightly_alignment.ps1 @parameters

      - name: Create GitHub release
        if: ${{ steps.target.outputs.should_release == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ steps.target.outputs.nightly_tag }}
          NIGHTLY_SHA: ${{ steps.target.outputs.source_sha }}
          MCP_VERSION: ${{ steps.target.outputs.mcp_version }}
          RELEASE_HASH: ${{ steps.target.outputs.release_hash }}
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
          ASSET_STEM: ${{ steps.target.outputs.asset_stem }}
        run: |
          $ErrorActionPreference = "Stop"
          $archivePath = ".tmp\release-output\$env:ASSET_STEM.zip"
          $digestPath = "$archivePath.sha256"
          if (-not (Test-Path -LiteralPath $archivePath)) {
            throw "Missing release archive: $archivePath"
          }
          if (-not (Test-Path -LiteralPath $digestPath)) {
            throw "Missing release digest: $digestPath"
          }

          $notesPath = ".tmp\release-notes.md"
          @"
          Official REF Nightly: [$env:NIGHTLY_TAG](https://github.com/praydog/REFramework-nightly/releases/tag/$env:NIGHTLY_TAG)

          Source commit: [$env:NIGHTLY_SHA](https://github.com/praydog/REFramework/commit/$env:NIGHTLY_SHA)

          Build ID: $env:RELEASE_HASH
          "@ | Set-Content -LiteralPath $notesPath -Encoding utf8NoBOM

          $releaseArguments = @(
            "release", "create",
            $env:RELEASE_TAG,
            $archivePath,
            $digestPath,
            "--repo", $env:GITHUB_REPOSITORY,
            "--target", $env:GITHUB_SHA,
            "--title", "REFramework-MCP $env:MCP_VERSION - REF Nightly $env:NIGHTLY_TAG - $env:RELEASE_HASH",
            "--notes-file", $notesPath
          )
          & gh @releaseArguments
          if ($LASTEXITCODE -ne 0) {
            throw "Creating the GitHub release failed."
          }

          "Release: $env:RELEASE_TAG" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
