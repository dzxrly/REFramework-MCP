name: Release

on:
  schedule:
    # 08:30 Beijing time (UTC+8), once per day.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      nightly_tag:
        description: Optional official REFramework-nightly tag; defaults to latest
        required: false
        type: string
      force_build:
        description: Build even when this Nightly already has a successful release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ref-nightly-release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release target
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      should_build: ${{ steps.target.outputs.should_build }}
      should_publish: ${{ steps.target.outputs.should_publish }}
      source_commit: ${{ steps.target.outputs.source_commit }}
      release_tag: ${{ steps.target.outputs.release_tag }}

    steps:
      - uses: actions/checkout@v7

      - name: Resolve official REF Nightly and release identity
        id: target
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.nightly_tag }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          $ErrorActionPreference = "Stop"
          $forceBuild = $env:FORCE_BUILD -eq "true"
          .\scripts\resolve_release_target.ps1 `
            -OutputPath ".tmp\release-target.json" `
            -Repository $env:GITHUB_REPOSITORY `
            -RequestedTag $env:REQUESTED_TAG `
            -ForceBuild:$forceBuild

          $target = Get-Content -LiteralPath ".tmp\release-target.json" -Raw |
            ConvertFrom-Json
          @"
          ## REF Nightly target

          - Target: $($target.nightly_tag)
          - Source: $($target.source_commit)
          - Release: $($target.release_tag)
          - Decision: $($target.decision)
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload ReleaseTarget
        if: ${{ steps.target.outputs.should_build == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-target
          path: .tmp/release-target.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  compatibility:
    name: Validate REF Nightly compatibility
    needs: resolve
    if: ${{ needs.resolve.outputs.should_build == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v7

      - name: Check out official REF Nightly source
        uses: actions/checkout@v7
        with:
          repository: praydog/REFramework
          ref: ${{ needs.resolve.outputs.source_commit }}
          path: reframework-source
          submodules: recursive

      - name: Download ReleaseTarget
        uses: actions/download-artifact@v4
        with:
          name: release-target
          path: .tmp

      - name: Compile and verify REF Nightly
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\scripts\test_ref_nightly_compatibility.ps1 `
            -REFrameworkRoot "$env:GITHUB_WORKSPACE\reframework-source" `
            -ReleaseTargetPath "$env:GITHUB_WORKSPACE\.tmp\release-target.json"

      - name: Summarize compatibility result
        if: ${{ always() }}
        shell: pwsh
        run: |
          $reportPath = ".tmp\nightly-diagnostics\compatibility-report.json"
          if (Test-Path -LiteralPath $reportPath) {
            $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
            @"
            ## REF Nightly compatibility

            - Status: $($report.status)
            - Stage: $($report.failure_stage)
            - Target: $($report.official_nightly_tag)
            - Source: $($report.source_commit)
            - Adapter: $($report.adapter_mode)
            "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Upload compatible runtime
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: compatible-runtime
          path: .tmp/nightly-compatible-runtime
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload compatibility diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-diagnostics-${{ github.run_id }}
          path: .tmp/nightly-diagnostics
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  package-release:
    name: Test, package, and release
    needs:
      - resolve
      - compatibility
    if: ${{ needs.resolve.outputs.should_build == 'true' && needs.compatibility.result == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v7

      - name: Download ReleaseTarget
        uses: actions/download-artifact@v4
        with:
          name: release-target
          path: .tmp

      - name: Download compatible runtime
        uses: actions/download-artifact@v4
        with:
          name: compatible-runtime
          path: .tmp/nightly-compatible-runtime

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          check-latest: true
          cache: pip

      - name: Test and package release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\scripts\package_ref_nightly_release.ps1 `
            -ReleaseTargetPath "$env:GITHUB_WORKSPACE\.tmp\release-target.json" `
            -RuntimeDirectory "$env:GITHUB_WORKSPACE\.tmp\nightly-compatible-runtime" `
            -OutputDirectory "$env:GITHUB_WORKSPACE\.tmp\release-output"

      - name: Summarize package result
        if: ${{ always() }}
        shell: pwsh
        run: |
          $reportPath = ".tmp\nightly-package-diagnostics\package-report.json"
          if (Test-Path -LiteralPath $reportPath) {
            $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
            @"
            ## Release package

            - Status: $($report.status)
            - Stage: $($report.failure_stage)
            - Release: $($report.release_tag)
            - Archive: $($report.archive_name)
            "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Upload package diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: package-diagnostics-${{ github.run_id }}
          path: .tmp/nightly-package-diagnostics
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Create GitHub release
        if: ${{ success() && needs.resolve.outputs.should_publish == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $target = Get-Content -LiteralPath ".tmp\release-target.json" -Raw |
            ConvertFrom-Json
          $archivePath = Join-Path ".tmp\release-output" $target.archive_name
          $digestPath = "$archivePath.sha256"
          foreach ($path in @($archivePath, $digestPath)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing release artifact: $path"
            }
          }

          $releaseArguments = @(
            "release", "create",
            [string] $target.release_tag,
            $archivePath,
            $digestPath,
            "--repo", $env:GITHUB_REPOSITORY,
            "--target", $env:GITHUB_SHA,
            "--title", [string] $target.release_title,
            "--notes="
          )
          & gh @releaseArguments
          if ($LASTEXITCODE -ne 0) {
            throw "Creating the GitHub release failed."
          }

          "Release: $($target.release_tag)" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
