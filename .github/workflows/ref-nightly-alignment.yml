name: REF Nightly Alignment

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      nightly_tag:
        description: Optional official REFramework-nightly release tag; defaults to latest
        required: false
        type: string
      force_rebuild:
        description: Rebuild even when this Nightly and adapter revision already passed
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ref-nightly-alignment
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve official REF Nightly
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      release_number: ${{ steps.release.outputs.release_number }}
      sha: ${{ steps.release.outputs.sha }}
      baseline_tag: ${{ steps.release.outputs.baseline_tag }}

    steps:
      - uses: actions/checkout@v7

      - name: Resolve release tag and source commit
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.nightly_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          if ([string]::IsNullOrWhiteSpace($env:REQUESTED_TAG)) {
            $uri = "https://api.github.com/repos/praydog/REFramework-nightly/releases/latest"
          } else {
            $encodedTag = [Uri]::EscapeDataString($env:REQUESTED_TAG)
            $uri = "https://api.github.com/repos/praydog/REFramework-nightly/releases/tags/$encodedTag"
          }
          $release = Invoke-RestMethod -Uri $uri -Headers $headers
          $match = [regex]::Match(
            [string] $release.tag_name,
            "^nightly-(?<number>[0-9]+)-(?<sha>[0-9a-f]{40})$"
          )
          if (-not $match.Success) {
            throw "Unexpected official REF Nightly tag format: $($release.tag_name)"
          }

          $baseline = Get-Content -LiteralPath "reframework\nightly-baseline.json" -Raw |
            ConvertFrom-Json
          $sha = $match.Groups["sha"].Value
          "tag=$($release.tag_name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_number=$($match.Groups['number'].Value)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "baseline_tag=$($baseline.tag)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          @"
          ## Official REF Nightly target

          - Release: $($release.tag_name)
          - Source commit: $sha
          - Current verified baseline: $($baseline.tag)
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  align:
    name: Build and verify REF Nightly
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v7

      - name: Restore successful alignment marker
        id: alignment-cache
        uses: actions/cache/restore@v4
        with:
          path: .nightly-alignment-cache
          key: ref-nightly-${{ runner.os }}-${{ needs.resolve.outputs.sha }}-${{ hashFiles('reframework/**', 'bridge/**', 'CMakeLists.txt', 'pyproject.toml', 'scripts/build_ref_nightly_alignment.ps1') }}

      - name: Report already verified Nightly
        if: ${{ steps.alignment-cache.outputs.cache-hit == 'true' && inputs.force_rebuild != true }}
        shell: pwsh
        env:
          NIGHTLY_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          @"
          ## Alignment build skipped

          $env:NIGHTLY_TAG already passed with the current adapter revision.
          Use force_rebuild from workflow_dispatch to run it again.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Check out official REF Nightly source
        if: ${{ steps.alignment-cache.outputs.cache-hit != 'true' || inputs.force_rebuild == true }}
        uses: actions/checkout@v7
        with:
          repository: praydog/REFramework
          ref: ${{ needs.resolve.outputs.sha }}
          path: reframework-source
          submodules: recursive

      - uses: actions/setup-python@v7
        if: ${{ steps.alignment-cache.outputs.cache-hit != 'true' || inputs.force_rebuild == true }}
        with:
          python-version: "3.13"
          cache: pip

      - name: Run full alignment build
        if: ${{ steps.alignment-cache.outputs.cache-hit != 'true' || inputs.force_rebuild == true }}
        shell: pwsh
        env:
          NIGHTLY_TAG: ${{ needs.resolve.outputs.tag }}
          NIGHTLY_SHA: ${{ needs.resolve.outputs.sha }}
          NIGHTLY_NUMBER: ${{ needs.resolve.outputs.release_number }}
        run: |
          $ErrorActionPreference = "Stop"
          $parameters = @{
            REFrameworkRoot = "$env:GITHUB_WORKSPACE\reframework-source"
            NightlyTag = $env:NIGHTLY_TAG
            SourceCommit = $env:NIGHTLY_SHA
            ReleaseNumber = $env:NIGHTLY_NUMBER
            OutputDirectory = $env:GITHUB_WORKSPACE
          }
          .\scripts\build_ref_nightly_alignment.ps1 @parameters

      - name: Upload alignment diagnostics
        if: ${{ always() && (steps.alignment-cache.outputs.cache-hit != 'true' || inputs.force_rebuild == true) }}
        uses: actions/upload-artifact@v4
        with:
          name: ref-nightly-${{ needs.resolve.outputs.release_number }}-diagnostics
          path: .tmp/nightly-diagnostics
          if-no-files-found: warn
          retention-days: 30

      - name: Upload aligned runtime package
        if: ${{ success() && (steps.alignment-cache.outputs.cache-hit != 'true' || inputs.force_rebuild == true) }}
        uses: actions/upload-artifact@v4
        with:
          name: reframework-mcp-1.0.0-ref-nightly-${{ needs.resolve.outputs.release_number }}-windows-x64
          path: |
            reframework-mcp-1.0.0-ref-nightly-${{ needs.resolve.outputs.release_number }}-windows-x64.zip
            reframework-mcp-1.0.0-ref-nightly-${{ needs.resolve.outputs.release_number }}-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create successful alignment marker
        if: ${{ success() && (steps.alignment-cache.outputs.cache-hit != 'true' || inputs.force_rebuild == true) }}
        shell: pwsh
        env:
          NIGHTLY_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force -Path ".nightly-alignment-cache" | Out-Null
          $env:NIGHTLY_TAG |
            Set-Content -LiteralPath ".nightly-alignment-cache\passed.txt" -Encoding utf8NoBOM

      - name: Save successful alignment marker
        if: ${{ success() && steps.alignment-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .nightly-alignment-cache
          key: ref-nightly-${{ runner.os }}-${{ needs.resolve.outputs.sha }}-${{ hashFiles('reframework/**', 'bridge/**', 'CMakeLists.txt', 'pyproject.toml', 'scripts/build_ref_nightly_alignment.ps1') }}
